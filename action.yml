name: 'PromptWheel Outcome Gate'
description: "Deterministic, zero-LLM PR check: a win must survive a re-run from the source edits alone, or it reads GAMED (exit 2)."
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  base:
    description: 'Base ref/sha to compare against'
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  repeat:
    description: 'Samples per metric to establish a noise band (use >1 for noisy metrics)'
    required: false
    default: '1'
  allow:
    description: 'A declared reason that clears allowable guards (the only path for the supply-chain preset). Set it from a step an agent cannot reach, such as a dependency-bot PR check. See packs/supply-chain/README.md.'
    required: false
    default: ''
  inconclusive:
    description: 'What an inconclusive verdict does to the job: fail, or pass with the comment still posted. Use pass where tests may not run in CI. A failed or gamed verdict always fails.'
    required: false
    default: 'fail'
  comment:
    description: 'Post the verdict as a PR comment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'

    # Runs straight from this action's own checkout: no npm install, no build.
    # a person's approval on the PR: the newest `sawbuck-allow: <reason>` comment from someone with write access
    - id: approval
      if: ${{ inputs.allow == '' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        reason=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" 2>/dev/null | node "$GITHUB_ACTION_PATH/bin/promptwheel.mjs" pr-allow 2>/dev/null || true)
        { echo 'allow<<SAWBUCK_ALLOW_END'; printf '%s\n' "$reason"; echo 'SAWBUCK_ALLOW_END'; } >> "$GITHUB_OUTPUT"

    - id: gate
      shell: bash
      env:
        ALLOW: ${{ inputs.allow || steps.approval.outputs.allow }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/bin/promptwheel.mjs" run \
          --base "${{ inputs.base }}" --head HEAD --repeat "${{ inputs.repeat }}" --markdown ${ALLOW:+--allow "$ALLOW"} \
          > "$RUNNER_TEMP/promptwheel.md"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/promptwheel.md" >> "$GITHUB_STEP_SUMMARY"

    - if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/promptwheel.md" || true

    # Propagate the gate's exit code: 0 pass, 1 fail (a guarded metric regressed or a mandate
    # was violated), 2 gamed, 3 inconclusive, 64 usage/config error (a broken config fails the
    # job too, but it is never reported as a verdict).
    - shell: bash
      env:
        GATE_EXIT: ${{ steps.gate.outputs.exit }}
        INCONCLUSIVE: ${{ inputs.inconclusive }}
      run: |
        if [ "$GATE_EXIT" = 3 ] && [ "$INCONCLUSIVE" = pass ]; then
          echo "::warning::Sawbuck could not measure your tests here, so nothing was proved. Protected paths were still checked."
          exit 0
        fi
        exit "$GATE_EXIT"
