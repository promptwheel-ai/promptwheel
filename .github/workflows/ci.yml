name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test

  # dogfood: gate our own change with our own tool (reward-hack detection on).
  # Enforces the constitution (tests pass · zero runtime deps · engine stays lean)
  # and would flag a gamed win in our own PRs: promptwheel run on promptwheel.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # need history for base..head
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node bin/promptwheel.mjs run --detect-gaming

  # cross-OS proof of the headline claim: a green that came from editing the TEST
  # instead of the code is caught as GAMED everywhere. The detector is git-only
  # (diff classification of source vs goalpost), so this confirms it travels.
  # shell: bash gives a real grep on Windows too (git-bash). Windows is informational.
  gamed-catch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: a red->green-by-editing-the-test win is caught (never passes) on every OS
        run: |
          set -u
          PW="$GITHUB_WORKSPACE/bin/promptwheel.mjs"
          TMP="$(mktemp -d)"; cd "$TMP"
          git init -q; git config user.email ci@ci; git config user.name ci
          printf 'export const mul=(a,b)=>a+b;\n' > index.mjs                 # bug: a+b, not a*b
          printf '{"name":"x","version":"1.0.0","type":"module","scripts":{"test":"node --test"}}\n' > package.json
          mkdir test
          printf 'import {test} from "node:test";import a from "node:assert/strict";import {mul} from "../index.mjs";test("mul",()=>a.equal(mul(2,3),6));\n' > test/mul.test.mjs
          node "$PW" init >/dev/null 2>&1
          git add -A; git commit -qm "red: mul is buggy, test expects 6 and fails"
          # game it: edit the TEST to match the bug, instead of fixing the code
          printf 'import {test} from "node:test";import a from "node:assert/strict";import {mul} from "../index.mjs";test("mul",()=>a.equal(mul(2,3),5));\n' > test/mul.test.mjs
          set +e; node "$PW" run --working > out.txt 2>&1; code=$?; set -e
          cat out.txt
          # The guarantee: the gamed green is CAUGHT (never exit 0) and NAMED GAMED. On Linux/macOS
          # that is the dedicated GAMED verdict (exit 2). Where the starter grep tripwires cannot run
          # (no unix-like shell, e.g. native Windows) those metrics read unmeasurable and the gate
          # fails closed (exit 1), still flagging GAMED on the winning metric. Either way it never passes.
          test "$code" -ne 0 || { echo "FAIL: a gamed green PASSED (exit 0) on $RUNNER_OS"; exit 1; }
          grep -q "GAMED" out.txt || { echo "FAIL: no GAMED flag on $RUNNER_OS"; exit 1; }
          echo "PASS: gamed green caught on $RUNNER_OS (exit $code), node $(node -v)"
