# Example: copy this into YOUR repo as .github/workflows/promptwheel.yml (zero-config works;
# a promptwheel.config.json at the root customizes what is measured).
# Posts a verdict comment on every PR and fails the check on a guarded regression beyond
# the noise band, a GAMED win (exit 2), or an inconclusive gate (exit 3).
name: PromptWheel

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # needed to post the verdict comment

jobs:
  outcome-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need base history to measure before/after
      - uses: promptwheel-ai/promptwheel@v0
        with:
          repeat: '3'             # sample noisy metrics 3× before trusting a delta
          # base: ${{ github.event.pull_request.base.sha }}   # default
          # comment: 'true'                                   # default
